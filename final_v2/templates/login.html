<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>System Login</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 380px;
      }
      h2 {
        margin-top: 0;
        color: #1e293b;
        text-align: center;
      }
      label {
        font-size: 13px;
        color: #475569;
        display: block;
        margin-bottom: 5px;
      }
      input {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      .flash {
        color: #dc2626;
        text-align: center;
        margin-bottom: 15px;
        font-size: 14px;
      }
      /* Added styling for the forgot password link placement */
      .forgot-link-container {
        text-align: right;
        margin-top: -12px;
        margin-bottom: 20px;
      }
      .forgot-link {
        font-size: 12px;
        color: #64748b;
        text-decoration: none;
      }
      .forgot-link:hover {
        color: #2563eb;
        text-decoration: underline;
      }
/* Company Logo */
.company-logo {
  display: flex;
  justify-content: center;
  margin: 14px 0 18px;
}

.company-logo img {
  width: 95px;
  height: auto;
  object-fit: contain;
  opacity: 0.95;
  transition: transform 0.2s ease;
}

.company-logo img:hover {
  transform: scale(1.03);
}
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Ai Inventory</h2>
      {% with messages = get_flashed_messages() %} {% if messages %} {% for
      message in messages %}
      <div class="flash">{{ message }}</div>
      {% endfor %} {% endif %} {% endwith %}
      <form action="{{ url_for('login') }}" method="POST">
        <label>Username</label>
        <input type="text" name="username" placeholder="e.g. admin" required />
        
        <label>Password</label>
        <input
          type="password"
          name="password"
          placeholder="••••••••"
          required
        />
        
<div class="forgot-link-container">
  <a href="{{ url_for('forgot_password') }}" class="forgot-link">
    Forgot Password?
  </a>
</div>

<div class="company-logo">
  <img src="{{ url_for('static', filename='images/Infopie-logo.png') }}"
       alt="Infopie Logo">
</div>

<button type="submit">Sign In</button>
        
      </form>
    </div>
  </body>
</html>
