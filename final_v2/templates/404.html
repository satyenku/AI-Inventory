<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — AI Inventory</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 10px;
            padding: 48px 40px 40px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .icon { font-size: 52px; margin-bottom: 20px; }
        .code {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #2563eb;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 4px;
            padding: 3px 10px;
            margin-bottom: 20px;
        }
        h1 { font-size: 22px; color: #1e293b; margin-bottom: 12px; font-weight: 700; }
        p  { font-size: 14px; color: #64748b; line-height: 1.65; margin-bottom: 24px; }
        .btn {
            display: inline-block;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 700;
            transition: background 0.15s;
        }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔍</div>
        <span class="code">ERROR 404 — NOT FOUND</span>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved.<br>
           Check the URL or head back to the dashboard.</p>
        <a href="{{ url_for('dashboard') }}" class="btn">Go to Dashboard</a>
    </div>
</body>
</html>
