<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>QR Code Generator</title>

<style>

body{

    font-family:Arial;

    background:#f4f6f9;

    margin:0;

}

.container{

    width:700px;

    margin:50px auto;

    background:white;

    padding:30px;

    border-radius:10px;

    box-shadow:0px 0px 10px lightgray;

}

h2{

    text-align:center;

}

input{

    width:100%;

    padding:12px;

    margin-top:10px;

    margin-bottom:20px;

    font-size:16px;

}

button{

    padding:12px 25px;

    background:#2563eb;

    color:white;

    border:none;

    border-radius:5px;

    cursor:pointer;

    font-size:16px;

}

button:hover{

    background:#1d4ed8;

}

.result{

    text-align:center;

    margin-top:30px;

}

img{

    width:250px;

}

.scan{

    margin-top:25px;

}

</style>

</head>

<body>

<div class="container">

<h2>QR Code Generator Demo</h2>

<form action="/generate" method="POST">

<label><b>Product Name</b></label>

<input

type="text"

name="product"

placeholder="Enter Product Name"

required>

<button type="submit">

Generate QR

</button>

</form>

{% if qr %}

<hr>

<div class="result">

<h3>Product</h3>

<p>{{product}}</p>

<h3>QR Number</h3>

<p>{{code}}</p>

<img src="{{qr}}">

<div class="scan">

<a href="/scan">

<button>

Scan QR

</button>

</a>

</div>

</div>

{% endif %}

</div>

</body>

</html>
